name: fetch daily wordle answer
# a workflow file that fetches the daily wordle answer from the new york times. it's an unofficial api so it may be deprecated in the future.
on:
  schedule:
    # runs every mondayat 6:25am UTC --> 12:25am cst --> 1:25am est
    - cron: '25 6 * * 1'
  workflow_dispatch: {}   # allows manual trigger from github actions tab

permissions:
  contents: write

jobs:
  update-answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch today's NYT wordle answer
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          curl -sf "https://www.nytimes.com/svc/wordle/v2/${DATE}.json" -o raw.json
          SOLUTION=$(python3 -c "import json;print(json.load(open('raw.json'))['solution'].upper())")
          printf '{"date":"%s","answer":"%s"}\n' "$DATE" "$SOLUTION" > today-answer.json
          rm raw.json
          cat /pichordle/today-answer.json

      - name: commit to today-answer.json if new answer detected
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today-answer.json
          git diff --staged --quiet || git commit -m "fetched daily wordle answer for ${DATE}"
          git push
