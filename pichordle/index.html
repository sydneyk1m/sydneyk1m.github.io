<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/winchonkun.png" />
<title>pichordle</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #d4d6da;
    --tile-bg: #ffffff;
    --tile-border: #d6d8dc;
    --ink: #000001;
    --ink-dim: #000000;
    --accent: #0095e0a9;
    --accent-dim: #54c2f193;
    --dark: #000000;
    --white: #ffffff;
    --green: #6baa64;
    --yellow:#c8b458;
    --gray: #787c7f;
    --red: #B0574A;
    --sansserif: 'Clear Sans', 'Helvetica Neue', 'Arial', sans-serif;
  }

  * { box-sizing: border-box; }

  @font-face {
    font-family: "Clear Sans";
    src:
        url("../clearsans/ClearSans-Regular.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Clear Sans";
    src:
        url("../clearsans/ClearSans-Bold.woff") format("woff");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    /* background-image: radial-gradient(circle at 50% -10%, rgba(16, 146, 245, 0.772), transparent 60%); */
    color: var(--ink);
    font-family: var(--sansserif);
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  header { text-align: center; }

  .eyebrow {
    font-family: var(--sansserif);
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--accent);
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--sansserif);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0 0 6px;
  }

  .tagline { font-family: var(--sansserif); font-size: 13px; color: var(--ink-dim); margin: 0; }

  .mode-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sansserif);
    font-size: 12px;
    color: var(--ink-dim);
  }

  .mode-badge {
    background: var(--panel);
    border: 1px solid var(--tile-border);
    border-radius: 999px;
    padding: 4px 12px;
    color: var(--gray);
  }

  .timer-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--tile-border);
    border-radius: 10px;
    padding: 14px 22px;
    box-shadow: inset 0 1px 0 rgba(214, 216, 220, 0.03), 0 8px 24px rgba(214, 216, 220, .35);
  }

  .timer {
    font-family: var(--sansserif);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--gray);
    transition: color 0.15s ease, text-shadow 0.15s ease;
    min-width: 9ch;
    text-align: center;
  }

  .timer.running { color: var(--white); text-shadow: 0 0 14px rgba(214, 216, 220, .35); }
  .timer.locked { animation: lockFlash 0.4s ease; }

  @keyframes lockFlash {
    0% { color: var(--ink); text-shadow: none; }
    35% { color: var(--bg); background: var(--accent); }
    100% { color: var(--ink); text-shadow: none; }
  }

  .timer-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--tile-border);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .timer-dot.live {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .row.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  .tile {
    width: 54px; height: 54px;
    border: 2px solid var(--tile-border);
    background: var(--tile-bg);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sansserif);
    font-size: 26px; font-weight: 700;
    line-height: 1;
    color: var(--ink);
    text-transform: uppercase;
    transform-style: preserve-3d;
  }

  .tile span {
    transform: translateY(-0.06em);
  }

  .tile.filled { border-color: #565947; animation: pop 0.1s ease; }
  @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }

  .tile.flip {
    animation-name: flipTile;
    animation-duration: 0.55s;
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
  }

  @keyframes flipTile {
    0%   { transform: rotateX(0deg); border-color: var(--tile-border); background: var(--tile-bg); color: var(--ink); }
    50%  { transform: rotateX(90deg); color: var(--ink); }
    51%  { background: var(--row-bg, var(--tile-bg)); border-color: var(--row-bg, var(--tile-border)); color: var(--white); }
    100% { transform: rotateX(0deg); background: var(--row-bg, var(--tile-bg)); border-color: var(--row-bg, var(--tile-border)); color: var(--white); }
  }

  .tile.correct { --row-bg: var(--green); }
  .tile.present { --row-bg: var(--yellow); }
  .tile.absent  { --row-bg: var(--gray); }

  @media (prefers-reduced-motion: reduce) {
    .tile.flip { animation: none; }
    .tile.correct { background: var(--green); border-color: var(--green); color: var(--white); }
    .tile.present { background: var(--yellow); border-color: var(--yellow); color: var(--white); }
    .tile.absent  { background: var(--gray); border-color: var(--gray); color: var(--white); }
    .timer.locked { animation: none; }
    .row.shake { animation: none; }
  }

  .message { font-family: var(--sansserif); min-height: 20px; font-size: 13px; color: var(--ink-dim); text-align: center; }
  .message.win { color: var(--green); }
  .message.lose { color: var(--yellow); }
  .message.warn { color: var(--red); }

  .keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 420px; }
  .krow { display: flex; justify-content: center; gap: 5px; }

  .key {
    font-family: var(--sansserif); font-weight: 505; font-size: 20px;
    background: #787c7e; color: var(--ink);
    border: none; border-radius: 5px;
    height: 54px; flex: 0 0 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .key:active { transform: scale(0.94); }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .key.wide { flex: 0 0 54px; font-size: 11px; }
  .key.correct { background: var(--green); color: #14170F; }
  .key.present { background: var(--yellow); color: #14170F; }
  .key.absent  { background: #d4d6da; color: var(--white); }
  .key:disabled { opacity: 0.4; cursor: default; }

  .controls {
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; color: var(--ink-dim); font-family: var(--sansserif);
  }

  .new-word-btn {
    font-family: var(--sansserif); font-weight: 600; font-size: 13px;
    background: transparent; border: 1px solid var(--tile-border); color: var(--ink);
    padding: 9px 16px; border-radius: 7px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .new-word-btn:hover { border-color: var(--accent); }
  .new-word-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .new-word-btn:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 380px) {
    .tile { width: 15vw; height: 15vw; font-size: 6vw; }
    .timer { font-size: 26px; }
    .key { flex-basis: 8.5vw; height: 12vw; font-size: 3.6vw; }
    .key.wide { flex-basis: 12.5vw; } 
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <!-- <p class="eyebrow">an automatically timed wordle for the daikin data team.</p> -->
    <h1>pichordle</h1>
    <!-- <p class="tagline">an automatically timed wordle for the daikin data team.</p> -->
    <!-- <p class="tagline">type your first letter to start the timer.</p> -->
  </header>

  <div class="mode-row">
    <span id="modeLabel">loading word lists…</span>
    <span class="mode-badge" id="dayBadge"></span>
  </div>

  <div class="board" id="board"></div>

  <div class="message" id="message">Loading word list…</div>

  <div class="keyboard" id="keyboard"></div>

  <div class="timer-wrap">
    <div class="timer-dot" id="timerDot"></div>
    <div class="timer" id="timer">00:00.000</div>
  </div>

  <div class="controls">
    <button class="new-word-btn" id="practiceBtn" disabled>break the game with this button</button>
    <span id="bestTime">best: —</span>
  </div>
</div>

<script>
(function () {
  // ---------------------------- word list sources ----------------------------------
  // in production, hosting these two newline-separated .txt files next to this
  // page will allow the fetches below to automatically pick them up:
  //   valid-wordle-words.txt  -> every guess players are allowed to submit
  //   wordle-answers.txt      -> the smaller pool that daily/practice answer is drawn from. might remove practice later
  const GUESS_LIST_URL = "valid-wordle-words.txt";
  const ANSWER_LIST_URL = "wordle-answers.txt";

  // Fallback so this preview still works with no file server behind it.
  const FALLBACK_ANSWERS = ["ABOUT","OTHER","WHICH","THEIR","THERE","FIRST","WATER","AFTER","WHERE","THINK",
    "WORLD","GREAT","SOUND","STILL","MOUNT","TABLE","STONE","LIGHT","SMILE","SPACE","PLANT","QUIET",
    "BRAVE","CROWN","DREAM","EARTH","FIELD","GHOST","HOUSE","IMAGE","LEMON","MONEY","NORTH","OCEAN",
    "PAPER","QUEEN","RIVER","SUGAR","TIGER","UNCLE","VOICE","WOMAN","YOUTH","ZEBRA","APPLE","BREAD",
    "CHESS","DANCE","EAGLE","FLAME","GRAPE","HONEY","IVORY","JELLY","LUCKY","MAGIC","NINJA","OLIVE",
    "PIANO","QUEST","ROYAL","SNAKE","TRUCK","UNITY","VITAL","WHALE","EXTRA","AMBER","BLAZE","CABLE",
    "DELTA","EMBER","FROST","GLIDE","HASTE","LODGE","MAPLE","NOBLE","ORBIT","PRIZE","RIDGE","STORM",
    "TOAST","URBAN","VALVE","WOVEN","YIELD"];
  const FALLBACK_EXTRA_GUESSES = ["ADIEU","STARE","CRANE","SLATE","TRACE","IRATE","ARISE","RAISE",
    "ALOOF","BEIGE","EPOCH","FUZZY","GAUZE","HUMID","LILAC","NAIVE","OXIDE","RUMBA","SIEVE","TULIP",
    "WALTZ","YACHT","FJORD","GUAVA","HYENA","OMEGA","PROXY","QUALM","RHYME","THYME","VOCAL","ABYSS",
    "BOUGH","CHUTE","DOUGH","FROTH","GRIME","HITCH","LATCH","MIRTH","NUDGE","OUNCE","PLUSH","QUOTA",
    "RELIC","SCORN"];

  const WORD_LEN = 5;
  const MAX_GUESSES = 6;
  // epoch for the daily word, day 0. not sure if this is necessary with the new pull logic
  const EPOCH = Date.UTC(2024, 0, 1);

  let VALID_GUESSES = new Set();
  let ANSWERS = [];
  let usingFallback = false;

  let target = "";
  let board = [];
  let currentRow = 0;
  let currentCol = 0;
  let gameOver = false;
  let animating = false;
  let startTime = null;
  let rafId = null;
  let bestTimeMs = null;
  let isDailyMode = true;
  const keyStatus = {};

  const boardEl = document.getElementById("board");
  const keyboardEl = document.getElementById("keyboard");
  const messageEl = document.getElementById("message");
  const timerEl = document.getElementById("timer");
  const timerDotEl = document.getElementById("timerDot");
  const bestTimeEl = document.getElementById("bestTime");
  const practiceBtn = document.getElementById("practiceBtn");
  const modeLabel = document.getElementById("modeLabel");
  const dayBadge = document.getElementById("dayBadge");

  function parseWordFile(text) {
    return text.split(/\r?\n/)
      .map(w => w.trim().toUpperCase())
      .filter(w => /^[A-Z]{5}$/.test(w));
  }

  async function loadWordLists() {
    try {
      const [guessText, answerText] = await Promise.all([
        fetch(GUESS_LIST_URL).then(r => { if (!r.ok) throw new Error("guess list missing"); return r.text(); }),
        fetch(ANSWER_LIST_URL).then(r => { if (!r.ok) throw new Error("answer list missing"); return r.text(); })
      ]);
      const guesses = parseWordFile(guessText);
      const answers = parseWordFile(answerText);
      if (guesses.length === 0 || answers.length === 0) throw new Error("empty list");
      answers.forEach(w => guesses.includes(w) || guesses.push(w)); // answers are always valid guesses
      VALID_GUESSES = new Set(guesses);
      ANSWERS = answers;
      usingFallback = false;
    } catch (e) {
      const guesses = FALLBACK_ANSWERS.concat(FALLBACK_EXTRA_GUESSES);
      VALID_GUESSES = new Set(guesses);
      ANSWERS = FALLBACK_ANSWERS;
      usingFallback = true;
    }
  }

  function dayIndex() {
    const now = new Date();
    const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayUTC - EPOCH) / 86400000);
  }

   function todayDateStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  // a weekly triggered GitHub Action fetches 7 days of real NYT solutions server-side
  // (avoiding CORS) and commits them here as a { "YYYY-MM-DD": "WORD" } map.
  // https://www.nytimes.com/svc/wordle/v2/YYYY-MM-DD.json is the (unofficial) source.
  const WEEKLY_ANSWERS_URL = "week-answers.json";

  async function getDailyAnswer() {
    try {
      const res = await fetch(`${WEEKLY_ANSWERS_URL}?t=${Date.now()}`); // cache-bust
      if (!res.ok) throw new Error("answers-week.json not found");
      const data = await res.json(); // e.g. { "2026-07-25": "CRANE", ... }
      const dateStr = todayDateStr();
      const word = String(data[dateStr] || "").trim().toUpperCase();
      if (!/^[A-Z]{5}$/.test(word)) throw new Error(`no synced answer for ${dateStr}`);
      return { word, synced: true, date: dateStr };
    } catch (e) {
      // falls back to a locally-computed word if today's date isn't in the
      // synced file (probably either the action hasn't run this week yet, or the batch
      // ran out before this date, or i'm testing and the site is running locally).
      const idx = dayIndex();
      const word = ANSWERS[((idx % ANSWERS.length) + ANSWERS.length) % ANSWERS.length];
      return { word, synced: false };
    }
  }

  function getPracticeAnswer() {
    let word;
    do { word = ANSWERS[Math.floor(Math.random() * ANSWERS.length)]; } while (word === target && ANSWERS.length > 1);
    return word;
  }

  function formatTime(ms) {
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const msPart = Math.floor(ms % 1000);
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(msPart).padStart(3,"0")}`;
  }

  function initBoard() {
    boardEl.innerHTML = "";
    board = [];
    for (let r = 0; r < MAX_GUESSES; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      const rowTiles = [];
      for (let c = 0; c < WORD_LEN; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        const letterSpan = document.createElement("span");
        tile.appendChild(letterSpan);
        rowEl.appendChild(tile);
        rowTiles.push({ el: tile, textEl: letterSpan, letter: "" });
      }
      boardEl.appendChild(rowEl);
      board.push({ el: rowEl, tiles: rowTiles });
    }
  }

  const KEY_ROWS = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["ENTER","Z","X","C","V","B","N","M","BACK"]
  ];

  function initKeyboard() {
    keyboardEl.innerHTML = "";
    KEY_ROWS.forEach(row => {
      const krow = document.createElement("div");
      krow.className = "krow";
      row.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key" + (k === "ENTER" || k === "BACK" ? " wide" : "");
        btn.textContent = k === "BACK" ? "⌫" : (k === "ENTER" ? "ENTER" : k);
        btn.dataset.key = k;
        btn.addEventListener("click", () => handleKey(k === "BACK" ? "Backspace" : (k === "ENTER" ? "Enter" : k)));
        krow.appendChild(btn);
      });
      keyboardEl.appendChild(krow);
    });
  }

  function refreshKeyboardColors() {
    document.querySelectorAll(".key").forEach(btn => {
      const status = keyStatus[btn.dataset.key];
      btn.classList.remove("correct","present","absent");
      if (status) btn.classList.add(status);
    });
  }

  function startTimerIfNeeded() {
    if (startTime !== null || gameOver) return;
    startTime = performance.now();
    timerEl.classList.add("running");
    timerDotEl.classList.add("live");
    tick();
  }

  function tick() {
    if (startTime === null) return;
    timerEl.textContent = formatTime(performance.now() - startTime);
    rafId = requestAnimationFrame(tick);
  }

  function stopTimer() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
    timerEl.classList.remove("running");
    timerDotEl.classList.remove("live");
    const elapsed = performance.now() - startTime;
    timerEl.textContent = formatTime(elapsed);
    timerEl.classList.add("locked");
    setTimeout(() => timerEl.classList.remove("locked"), 400);
    return elapsed;
  }

  function setMessage(text, kind) {
    messageEl.textContent = text;
    messageEl.className = "message" + (kind ? " " + kind : "");
  }

  function shakeCurrentRow() {
    const rowEl = board[currentRow].el;
    rowEl.classList.remove("shake");
    void rowEl.offsetWidth; // restart animation
    rowEl.classList.add("shake");
  }

  function handleKey(key) {
    if (gameOver || animating) return;

    if (/^[A-Za-z]$/.test(key)) {
      if (currentCol < WORD_LEN) {
        startTimerIfNeeded();
        const tile = board[currentRow].tiles[currentCol];
        tile.letter = key.toUpperCase();
        tile.textEl.textContent = tile.letter;
        tile.el.classList.add("filled");
        currentCol++;
      }
      return;
    }

    if (key === "Backspace") {
      if (currentCol > 0) {
        currentCol--;
        const tile = board[currentRow].tiles[currentCol];
        tile.letter = "";
        tile.textEl.textContent = "";
        tile.el.classList.remove("filled");
      }
      return;
    }

    if (key === "Enter") {
      if (currentCol !== WORD_LEN) { setMessage("not enough letters.", "warn"); shakeCurrentRow(); return; }
      const guess = board[currentRow].tiles.map(t => t.letter).join("");
      if (!VALID_GUESSES.has(guess)) {
        setMessage("not in word list.", "warn");
        shakeCurrentRow();
        return;
      }
      submitGuess(guess);
    }
  }

  function submitGuess(guess) {
    const result = evaluateGuess(guess, target);
    animating = true;
    setMessage("");

    const rowTiles = board[currentRow].tiles;
    const isWin = result.every(r => r === "correct");
    const isLastRow = currentRow === MAX_GUESSES - 1;
    const isDecidingRow = isWin || isLastRow;

    rowTiles.forEach((tile, i) => {
      tile.el.style.animationDelay = `${i * 300}ms`;
      tile.el.classList.add("flip", result[i]);

      setTimeout(() => {
        const letter = tile.letter;
        const current = keyStatus[letter];
        if (current !== "correct") keyStatus[letter] = result[i] === "present" && current === "correct" ? current : result[i];
        refreshKeyboardColors();
      }, i * 300 + 280);

      if (i === rowTiles.length - 1) {
        tile.el.addEventListener("animationend", function onEnd() {
          tile.el.removeEventListener("animationend", onEnd);
          animating = false;

          if (isDecidingRow) {
            const elapsed = stopTimer();
            gameOver = true;
            setKeyboardDisabled(true);
            if (isWin) {
              if (bestTimeMs === null || elapsed < bestTimeMs) {
                bestTimeMs = elapsed;
                bestTimeEl.textContent = `best: ${formatTime(bestTimeMs)}`;
              }
              setMessage(`Solved in ${formatTime(elapsed)}.`, "win");
            } else {
              setMessage(`too bad; today's word was ${target} — ${formatTime(elapsed)}.`, "lose");
            }
            if (isDailyMode) practiceBtn.disabled = false;
          } else {
            currentRow++;
            currentCol = 0;
          }
        }, { once: true });
      }
    });
  }

  function evaluateGuess(guess, target) {
    const result = new Array(WORD_LEN).fill("absent");
    const targetChars = target.split("");
    const guessChars = guess.split("");

    for (let i = 0; i < WORD_LEN; i++) {
      if (guessChars[i] === targetChars[i]) { result[i] = "correct"; targetChars[i] = null; }
    }
    for (let i = 0; i < WORD_LEN; i++) {
      if (result[i] === "correct") continue;
      const idx = targetChars.indexOf(guessChars[i]);
      if (idx !== -1) { result[i] = "present"; targetChars[idx] = null; }
    }
    return result;
  }

  function setKeyboardDisabled(disabled) {
    document.querySelectorAll(".key").forEach(btn => btn.disabled = disabled);
  }

  function resetRoundState() {
    currentRow = 0;
    currentCol = 0;
    gameOver = false;
    animating = false;
    startTime = null;
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
    for (const k in keyStatus) delete keyStatus[k];
    timerEl.textContent = "00:00.000";
    timerEl.classList.remove("running","locked");
    timerDotEl.classList.remove("live");
    initBoard();
    setKeyboardDisabled(false);
    refreshKeyboardColors();
  }

  async function startDaily() {
    isDailyMode = true;
    modeLabel.textContent = "Checking today's word…";
    const { word, synced, date } = await getDailyAnswer();
    target = word;
    modeLabel.textContent = synced ? "you are synced with NYT" : "you are offline (not synced with NYT)";
    dayBadge.textContent = synced ? date : `day #${dayIndex()}`;
    practiceBtn.disabled = true;
    setMessage("type your first letter to start the clock.");
    resetRoundState();
  }

  function startPractice() {
    isDailyMode = false;
    target = getPracticeAnswer();
    modeLabel.textContent = "practice round";
    dayBadge.textContent = "unlimited";
    setMessage("type your first letter to start the clock.");
    resetRoundState();
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Enter") handleKey("Enter");
    else if (e.key === "Backspace") handleKey("Backspace");
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key);
  });

  practiceBtn.addEventListener("click", startPractice);

  initKeyboard();
  loadWordLists().then(startDaily);
})();
</script>
</body>
</html>
